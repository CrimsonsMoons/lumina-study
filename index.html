<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lumina Launcher</title>
  <style>
    :root {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f7fb;background:#0b1019}
    * {box-sizing:border-box}
    body {min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main {width:min(100%,540px);border:1px solid #273245;background:#131c2a;padding:32px;border-radius:20px;box-shadow:0 18px 50px #0005}
    .mark {display:inline-block;color:#8bb8ff;font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}
    h1 {font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:14px 0}
    p {color:#b9c6d6;line-height:1.6;margin:0 0 24px}
    .actions {display:flex;gap:10px;flex-wrap:wrap}
    button,a.button {font:inherit;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:11px 17px;border-radius:11px;text-decoration:none;font-weight:650}
    button {background:#7faaff;color:#071220;border:0}
    a.button {background:transparent;color:#f6f7fb;border:1px solid #445166}
    button:focus-visible,a:focus-visible {outline:3px solid #a5ccff;outline-offset:3px}
    .note {font-size:.85rem;margin-top:24px;color:#91a0b4}
    #status {min-height:1.5em;margin:14px 0 0;color:#cfd8e7}
  </style>
</head>
<body>
  <main>
    <span class="mark">Lumina Study</span>
    <h1>Open Lumina</h1>
    <p>Launch Lumina in a new blank tab, or open it directly if your browser doesn't allow the embedded view.</p>
    <div class="actions">
      <button id="blank-button" type="button">Open in Blank Tab</button>
      <a class="button" href="https://googledrivedocs.netlify.app/" target="_blank" rel="noopener noreferrer">Open Lumina Directly</a>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="note">Blank mode depends on Lumina allowing embedding. Browser filters and website security restrictions still apply.</p>
  </main>
  <script>
    "use strict";
    const TARGET = "https://googledrivedocs.netlify.app/";
    document.getElementById("blank-button").addEventListener("click", () => {
      const tab = window.open("about:blank", "_blank");
      if (!tab) {
        document.getElementById("status").textContent = "Popup blocked. Allow popups for this site or use the direct link.";
        return;
      }
      const doc = tab.document;
      doc.title = "Lumina Study";
      doc.documentElement.style.cssText = "margin:0;height:100%;background:#0b1019;color:white;font-family:system-ui,sans-serif";
      doc.body.style.cssText = "margin:0;height:100%;display:flex;flex-direction:column";

      const bar = doc.createElement("div");
      bar.style.cssText = "display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 15px;background:#141c29;border-bottom:1px solid #354159";
      const title = doc.createElement("strong");
      title.textContent = "Lumina Study";
      const direct = doc.createElement("a");
      direct.href = TARGET;
      direct.target = "_blank";
      direct.rel = "noopener noreferrer";
      direct.textContent = "Not loading? Open Lumina directly";
      direct.style.cssText = "color:#a8caff;font-size:14px";
      bar.append(title, direct);

      const iframe = doc.createElement("iframe");
      iframe.src = TARGET;
      iframe.title = "Lumina Study";
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.style.cssText = "border:0;width:100%;flex:1;min-height:0;background:#fff";
      doc.body.append(bar, iframe);
      document.getElementById("status").textContent = "Blank tab opened. If Lumina refuses embedding, use the direct link.";
    });
  </script>
</body>
</html>
