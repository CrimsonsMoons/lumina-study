
<!DOCTYPE html>
<html>
<body>
<button onclick="openBlank()">Open in Blank Mode</button>

<script>
function openBlank() {
  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    alert("Please allow popups.");
    return;
  }

  tab.document.title = "HTML Workspace";
  tab.document.body.style.margin = "0";

  const iframe = tab.document.createElement("iframe");
  iframe.src = "https://codetester.io/runner/run-html/";
  iframe.style.cssText = `
    width: 100vw;
    height: 100vh;
    border: none;
    position: fixed;
    inset: 0;
  `;

  tab.document.body.appendChild(iframe);
}
</script>
</body>
</html>
